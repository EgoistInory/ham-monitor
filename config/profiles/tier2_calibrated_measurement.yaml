# Tier 2（专业 / 测量级 USB 麦克风，如 miniDSP UMIK-1 等带出厂灵敏度校准文件）
# 注意：即便启用 calibrated=true，自测读数仍仅用于工程量化与辅助举证；司法鉴定仍需 CMA 资质机构现场出具报告。

node:
  node_id: "tier2_umik1"
  location_tag: "room_center"
  calibrated: true
  calibration_file: "config/umik1_cal.txt"   # 填入你的测量麦校准文件路径
  sensitivity_offset_db: 120.0               # 按具体测量麦与增益标定后的 dBFS -> dB SPL 偏移量

audio:
  sample_rate: 48000
  channels: 1
  block_duration_sec: 0.25
  device: "UMIK-1"
  reconnect_interval_sec: 2.0

schedule:
  enabled: true
  start_time: "22:30"
  end_time: "07:00"

dsp:
  low_band_hz: [20.0, 180.0]
  high_band_hz: [300.0, 4000.0]
  baseline_window_sec: 180.0
  baseline_quantile: 0.20
  baseline_warmup_sec: 10.0

trigger:
  low_delta_db: 10.0
  low_min_dbfs: -68.0
  high_delta_db: 12.0
  high_min_dbfs: -62.0
  min_active_sec: 0.50
  pre_roll_sec: 15.0
  post_roll_sec: 10.0
  max_event_sec: 300.0

storage:
  base_dir: "data"
  evidence_dir: "data/evidence"
  raw_dir: "data/raw"
  db_path: "data/ham_events.sqlite3"
  reports_dir: "data/reports"
  raw_retention_days: 7
  audio_format: "FLAC"
