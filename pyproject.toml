[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ham-monitor"
version = "0.3.0"
description = "Passive acoustic monitoring, verifiable noise evidence logger, and local web workbench"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
]

[tool.fastapi]
entrypoint = "ham.web.app:app"

[tool.setuptools.packages.find]
include = ["ham*"]

[tool.setuptools.package-data]
"ham.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
